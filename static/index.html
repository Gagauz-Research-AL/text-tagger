<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-tagger</title>
<script src="/static/vue.global.prod.js"></script>
<script src="/static/logic.js"></script>
<style>

  :root {
    --paper-1: #f3f6f9;
    --paper-2: #e7edf4;
    --card: #ffffff;
    --ink: #10141a;
    --muted: #94a7b8;
    --line: #dfe7ef;
    --hover: #f2f6fa;
    --accent: #2f6bff;
    --warn: #d69a2d;
    --bad: #d98080;
    --ok: #2f9d63;
    --radius-lg: 20px;
    --radius-md: 14px;
    --pill: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 18% -12%, #ffffff 0%, rgba(255,255,255,0) 55%),
      radial-gradient(900px 600px at 100% 110%, #f6f9fc 0%, rgba(246,249,252,0) 50%),
      linear-gradient(160deg, var(--paper-1), var(--paper-2));
    background-attachment: fixed;
    color: var(--ink);
    font: 15px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: -0.01em;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1400px; margin: 0 auto; width: 100%;
    padding: 18px 32px;
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .brand-dot { color: var(--muted); font-weight: 500; font-size: 12px; vertical-align: super; margin-left: 2px; }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .header-stat { color: var(--muted); font-size: 12px; line-height: 1.1; }
  .header-stat b {
    display: inline-block; font-size: 30px; font-weight: 600; color: var(--ink);
    letter-spacing: -0.02em; margin-right: 7px; vertical-align: middle;
  }
  button {
    font: 500 13px/1 "Inter", system-ui, sans-serif; cursor: pointer;
    border-radius: var(--pill); background: var(--card); border: 1px solid var(--line);
    color: var(--ink); padding: 10px 20px; transition: all .15s;
  }
  button:hover { border-color: var(--ink); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  button.primary:hover { background: #232a33; }
  button.danger { background: transparent; border-color: var(--line); color: var(--muted); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); background: rgba(217,128,128,.06); }
  button.small { padding: 8px 16px; font-size: 12px; }
  button.circle-btn {
    width: 38px; height: 38px; padding: 0; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  main {
    display: grid; grid-template-columns: 1fr 380px; gap: 28px;
    max-width: 1400px; margin: 0 auto; padding: 6px 32px 32px;
    height: calc(100vh - 86px);
  }
  #editor {
    background: var(--card); border: 1px solid rgba(16,20,26,.06);
    border-radius: var(--radius-lg); padding: 56px 64px; overflow-y: auto;
    box-shadow: 0 24px 48px -12px rgba(15,23,42,.08);
  }
  #text-display { font-size: 24px; line-height: 2; outline: none; color: var(--ink); }
  #text-display span.tag {
    cursor: pointer; border-bottom: 2px solid; padding-bottom: 2px;
    border-radius: 2px; transition: all .15s;
  }
  #text-display span.tag:hover { background: rgba(16,20,26,.04); }
  .seg-grammatical, .seg-phrasing { border-color: var(--warn); }
  .seg-spelling { border-color: var(--bad); }
  .seg-other { border-color: var(--accent); }
  span.tag.selected {
    background: var(--ink); color: #fff; border-bottom-color: transparent;
    border-radius: 7px; padding: 1px 7px 3px;
  }
  aside {
    background: var(--card); border: 1px solid rgba(16,20,26,.06);
    border-radius: var(--radius-lg); padding: 30px;
    display: flex; flex-direction: column; gap: 22px; overflow-y: auto;
    box-shadow: 0 24px 48px -12px rgba(15,23,42,.08);
  }
  aside h2 {
    margin: 0; font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .16em;
  }
  .property-grid { display: grid; gap: 0; }
  .property-row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 11px 2px; border-top: 1px solid var(--line); font-size: 14px;
  }
  .property-row:first-child { border-top: 0; padding-top: 0; }
  .property-label {
    flex-shrink: 0; color: var(--muted); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em; padding-top: 3px;
  }
  .property-value { text-align: right; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .type-badge {
    display: inline-block; background: var(--hover); border: 1px solid var(--line);
    border-radius: var(--pill); padding: 3px 10px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .candidates { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .candidates li {
    background: var(--hover); border: 1px solid transparent; border-radius: var(--radius-md);
    padding: 12px 16px; cursor: pointer; transition: all .15s; font-size: 14px;
  }
  .candidates li:hover { background: #e8eff5; }
  .candidates li.current { background: var(--ink); color: #fff; }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type=text] {
    width: 100%; font: 500 14px/1.4 "Inter", system-ui, sans-serif;
    color: var(--ink); background: transparent; border: 0;
    border-bottom: 1px solid var(--line); padding: 10px 2px; transition: border .15s;
  }
  input[type=text]:focus { outline: none; border-color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: 1; }
  .muted { color: var(--muted); font-size: 13px; }
  .hint { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; text-align: center; }
  .toast { font-size: 12px; font-weight: 600; color: var(--ok); }
  .preview-card {
    background: var(--hover); border: 1px solid var(--line);
    border-radius: var(--radius-md); padding: 14px 16px; display: grid; gap: 8px;
  }
  .preview-row { display: flex; gap: 10px; align-items: baseline; }
  .preview-label {
    flex: 0 0 72px; color: var(--muted); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em;
  }
  .preview-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
  .preview-text.original { color: var(--muted); font-style: italic; }
  .preview-text.proposed { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">text-tagger<span class="brand-dot">&reg;</span></div>
    <div class="header-right">
      <span class="header-stat" v-if="job"><b>{{ String(job.underlines.length).padStart(2, "0") }}</b> tags left</span>
      <button class="primary" :disabled="!job" @click="approve">Approve</button>
      <span v-if="toast" class="toast">{{ toast }}</span>
    </div>
  </header>
  <main>
    <section id="editor">
      <div id="text-display" contenteditable="true" spellcheck="false"
           @input="onTextInput" @click="onTagClick" @keydown.enter.prevent="onEnter" @keydown="handleKeydown"></div>
    </section>
    <aside>
      <h2>Segment</h2>
      <template v-if="sel !== null && current">
        <div class="property-grid">
          <div class="property-row"><span class="property-label">original</span><span class="property-value"><i>{{ current.original }}</i></span></div>
          <div class="property-row"><span class="property-label">text</span><span class="property-value"><b>{{ current.text }}</b></span></div>
          <div class="property-row"><span class="property-label">type</span><span class="property-value"><span class="type-badge">{{ current.type }}</span></span></div>
        </div>
        <template v-if="current.candidates.length">
          <h2>Candidates</h2>
            <ul class="candidates">
              <li v-for="(c, i) in current.candidates" 
                :class="{ current: i === cand }" 
                @click="applySpecificCandidate(i)"
                style="cursor: pointer">{{ c }}</li>
            </ul>
          <div v-if="cand !== null" class="preview-card">
            <div class="preview-row">
              <span class="preview-label">Original:</span>
              <span class="preview-text original">{{ current.text }}</span>
            </div>
            <div class="preview-row">
              <span class="preview-label">Proposed:</span>
              <span class="preview-text proposed">{{ current.candidates[cand] }}</span>
            </div>
          </div>
          <div class="row">
            <button class="circle-btn" @click="cycle(-1)" aria-label="previous">&#8592;</button>
            <button class="circle-btn" @click="cycle(1)" aria-label="next">&#8594;</button>
            <button class="primary" @click="applyCandidate">Apply</button>
          </div>
        </template>
        <p v-else class="muted">no candidates for this span — fix it yourself below</p>
        <h2>Retype / split</h2>
        <form class="row" @submit.prevent="retype">
          <input type="text" v-model="retypeText" :placeholder="'.replace: [' + current.text + '] — insert a space to split'">
          <button class="small" type="submit">Replace</button>
        </form>
        <div class="row">
          <button class="danger small" @click="dropUnderline">Drop (false positive)</button>
        </div>
      </template>
      <p v-else class="muted">click an underlined span to act on it</p>
      <p class="hint">Approve prints the final text on the server console and ends the session.</p>
    </aside>
  </main>
</div>
<script>
const { createApp } = Vue;
const typePrefix = (t) => t.startsWith("weird spelling") ? "seg-spelling"
  : (t.startsWith("grammatical") || t.startsWith("phrasing")) ? "seg-grammatical" : "seg-other";

const normalizeText = (el) => {
  let t;
  try { t = el.innerText; } catch (e) { t = undefined; }
  if (typeof t !== "string") t = el.textContent || "";
  return t.replace(/\r?\n/g, " ").trim();
};

createApp({
  data: () => ({
    job: null, sel: null, cand: 0, retypeText: "", toast: "",
    history: [], future: [],
  }),
  computed: {
    current() {
      const u = this.sel === null ? null : this.job && this.job.underlines[this.sel];
      if (!u || !this.job) return null;
      return { 
        text: this.job.text.slice(u.left_pos, u.right_pos), 
        candidates: u.candidates, 
        type: u.type,
        original: u.original 
      };
    },
  },
  methods: {
    displayEl() { return document.getElementById("text-display"); },
    renderDisplay() {
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      let html = "";
      let pos = 0;
      this.job.underlines.forEach((u, i) => {
        if (u.left_pos > pos) html += esc(this.job.text.slice(pos, u.left_pos));
        const cls = ["tag", "seg-" + typePrefix(u.type)];
        if (i === this.sel) cls.push("selected");
        html += '<span class="' + cls.join(" ") + '" data-i="' + i + '">' +
                esc(this.job.text.slice(u.left_pos, u.right_pos)) + "</span>";
        pos = u.right_pos;
      });
      html += esc(this.job.text.slice(pos));
      this.displayEl().innerHTML = html;
    },
    styleSelected() {
      this.displayEl().querySelectorAll(".tag").forEach((n) =>
        n.classList.toggle("selected", +n.dataset.i === this.sel));
    },
    caretOffset() {
      const display = this.displayEl();
      const s = typeof window.getSelection === "function" ? window.getSelection() : null;
      if (!s || !s.rangeCount) return null;
      const range = s.getRangeAt(0);
      const c = range.startContainer;
      if (!display.contains(c)) return null;
      if (c === display) {
        let off = 0;
        for (let i = 0; i < range.startOffset && i < display.childNodes.length; i++) {
          off += display.childNodes[i].textContent.length;
        }
        return off;
      }
      let pos = 0;
      const walker = document.createTreeWalker(display, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node === c) return pos + range.startOffset;
        pos += node.textContent.length;
      }
      return pos;
    },
    spanAtCaret(off) {
      if (off === null || !this.job) return null;
      const spans = this.job.underlines;
      for (let i = 0; i < spans.length; i++) {
        const u = spans[i];
        if (off >= u.left_pos && off <= u.right_pos + 1) return i;
      }
      return null;
    },
    syncSelectionWithCaret() {
      const idx = this.spanAtCaret(this.caretOffset());
      if (idx === null) {
        this.sel = null;
        this.cand = 0;
        this.retypeText = "";
        this.styleSelected();
      } else if (idx !== this.sel) {
        this.select(idx);
      }
    },
    onSelectionChange() {
      if (document.activeElement === this.displayEl()) {
        this.syncSelectionWithCaret();
      }
    },
    updateJobFromDOM() {
      const newText = normalizeText(this.displayEl());
      if (!this.job || newText === this.job.text) return;
      this.pushHistory(this.caretOffset());
      const oldList = this.job.underlines.slice();
      const kept = applyDiffToUnderlines(this.job.text, newText, this.job.underlines);
      this.job = { text: newText, underlines: kept };
      this.refreshTags(oldList);
      this.syncSelectionWithCaret();
    },
    handleKeydown(ev) {
      const mod = ev.ctrlKey || ev.metaKey;
      if (!mod) return;
      const k = ev.key.toLowerCase();
      if (k === "z") { ev.preventDefault(); if (ev.shiftKey) this.redo(); else this.undo(); }
      else if (k === "y") { ev.preventDefault(); this.redo(); }
    },
    pushHistory(caret) {
      this.history.push({
        text: this.job.text,
        underlines: this.job.underlines.map((u) => ({ ...u })),
        caret,
      });
      if (this.history.length > 200) this.history.shift();
      this.future = [];
    },
    undo() {
      if (!this.history.length) return;
      this.future.push({
        text: this.job.text,
        underlines: this.job.underlines.map((u) => ({ ...u })),
        caret: this.caretOffset(),
      });
      const s = this.history.pop();
      this.job = { text: s.text, underlines: s.underlines };
      this.renderDisplay();
      this.setCaretOffset(s.caret);
      this.syncSelectionWithCaret();
    },
    redo() {
      if (!this.future.length) return;
      this.history.push({
        text: this.job.text,
        underlines: this.job.underlines.map((u) => ({ ...u })),
        caret: this.caretOffset(),
      });
      const s = this.future.pop();
      this.job = { text: s.text, underlines: s.underlines };
      this.renderDisplay();
      this.setCaretOffset(s.caret);
      this.syncSelectionWithCaret();
    },
    setCaretOffset(off) {
      if (off === null || off === undefined) return;
      const display = this.displayEl();
      const sel = window.getSelection();
      if (!sel) return;
      off = Math.max(0, Math.min(off, normalizeText(display).length));
      display.focus();
      const walker = document.createTreeWalker(display, NodeFilter.SHOW_TEXT);
      let pos = 0, node;
      while ((node = walker.nextNode())) {
        if (pos + node.textContent.length >= off) {
          const r = document.createRange();
          r.setStart(node, off - pos);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
          return;
        }
        pos += node.textContent.length;
      }
    },
    onTagClick(ev) {
      const t = ev.target.closest(".tag");
      if (t) this.select(+t.dataset.i);
      else this.syncSelectionWithCaret();
    },
    onEnter(ev) { ev.target.blur(); },
    select(i) { this.sel = i; this.cand = 0; this.retypeText = ""; this.styleSelected(); },
    onTextInput(ev) {
      this.updateJobFromDOM();
    },
    refreshTags(oldList) {
      const map = new Map(this.job.underlines.map((u, j) => [u, j]));
      const nodes = [...this.displayEl().querySelectorAll(".tag")];
      if (nodes.length !== oldList.length || !nodes.every((n) => oldList[+n.dataset.i])) {
        this.renderDisplay();
        return;
      }
      nodes.forEach((node) => {
        const old = oldList[+node.dataset.i];
        if (map.has(old)) node.dataset.i = map.get(old);
        else {
          node.replaceWith(document.createTextNode(node.textContent));
          if (this.sel !== null && oldList[this.sel] === old) this.sel = null;
        }
      });
      if (this.sel !== null && oldList[this.sel] && map.has(oldList[this.sel])) {
        this.sel = map.get(oldList[this.sel]);
      }
      this.styleSelected();
    },
    cycle(step) {
      const c = this.current && this.current.candidates.length;
      if (c) this.cand = (this.cand + step) % c;
    },
    applyCandidate() {
      if (this.sel === null) return;
      const u = this.job.underlines[this.sel];
      if (u.candidates.length) {
        this.pushHistory(this.caretOffset());
        replaceSegment(this.job, this.sel, u.candidates[this.cand]);
        this.renderDisplay();
      }
    },
    applySpecificCandidate(i) {
      this.cand = i;
      this.applyCandidate();
    },
    retype() {
      if (this.sel !== null && this.retypeText.trim()) {
        this.pushHistory(this.caretOffset());
        replaceSegment(this.job, this.sel, this.retypeText);
        this.retypeText = "";
        this.renderDisplay();
      }
    },
    dropUnderline() {
      if (this.sel !== null) {
        this.pushHistory(this.caretOffset());
        drop(this.job, this.sel);
        this.sel = null;
        this.renderDisplay();
      }
    },
    async approve() {
      const finalText = approve(this.job);
      try {
        await fetch("/api/result", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: finalText }),
        });
        this.toast = "approved";
        setTimeout(() => (this.toast = ""), 3000);
      } catch (e) {
        this.toast = "failed to save: " + e;
        setTimeout(() => (this.toast = ""), 5000);
      }
    },
  },
  async mounted() {
    window.__tt = this;
    document.addEventListener("selectionchange", this.onSelectionChange.bind(this));
    this.job = makeJob(await (await fetch("/api/job")).json());
    this.$nextTick(this.renderDisplay);
  },
}).mount("#app");
</script>
</body>
</html>
